name: Compilar y probar web
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verificar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verificar los doce ejercicios web y las sesiones
        shell: pwsh
        run: ./herramientas/probar-web.ps1
      - name: Publicar binarios web
        run: dotnet publish Web/PracticaWeb.csproj -c Release -o ejecutables-web
      - uses: actions/upload-artifact@v4
        with:
          name: practica-web-y-pruebas
          path: |
            ejecutables-web/
            pruebas-web.txt

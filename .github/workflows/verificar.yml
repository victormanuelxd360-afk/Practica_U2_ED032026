name: Compilar y probar CSharp
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verificar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compilar cuatro proyectos y probar
        shell: pwsh
        run: ./herramientas/compilar.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: practica-csharp-ejecutables-y-pruebas
          path: |
            ejecutables/
            pruebas-csharp.txt
            evidencias-csharp/
